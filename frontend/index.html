<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Votaciones Cusiana Decide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/favicon-512x512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192x192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon-180x180.png" />
  <link rel="manifest" href="manifest.json?v=7" />
  <link rel="stylesheet" href="css/estilos.css?v=22" />
</head>
  <body>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        if ('caches' in window) {
          caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }
        
        const ts = Date.now();
        const links = document.querySelectorAll('link[rel="stylesheet"]');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && !href.includes('?')) link.setAttribute('href', href + '?ts=' + ts);
        });
        const scripts = document.querySelectorAll('script[src]');
        scripts.forEach(script => {
          const src = script.getAttribute('src');
          if (src && !src.includes('?')) script.setAttribute('src', src + '?ts=' + ts);
        });
      });
    </script>
    
    <!-- PANTALLA ÚNICA: bienvenida + ingreso con código -->
    <div id="pantallaBienvenida" class="pantalla-bienvenida activo">
      <div class="hero-card">
        <header class="header-acceso logos-pantalla">
          <img src="icons/logo institucional.png" alt="Escudo de la Institución Educativa El Cusiana" class="logo-institucional-acceso" />
          <img src="icons/logo_cusiana_ok.png" alt="Logo Cusiana Decide" class="logo-cusiana-acceso" />
          <img src="icons/logo_sena_ok.png" alt="Logo SENA" class="logo-sena-acceso" />
        </header>
        
        <main class="vista-bienvenida">
          <h1>Bienvenido a <span class="resaltar">Cusiana Decide</span></h1>
          <h2>Tu voz cuenta</h2>
          <p class="subtitulo">Participa en las votaciones estudiantiles de forma fácil, segura y transparente.</p>
          
          <button type="button" class="boton boton-principal boton-grande" id="btnContinuar">
            <span>INGRESAR</span>
            <span class="icono-flecha">→</span>
          </button>
        </main>

        <main class="vista-acceso tarjeta-acceso">
          <p class="subtitulo-acceso">Ingresa tu código estudiantil para acceder a la votación</p>
          
          <form id="formLogin" class="formulario-acceso">
            <div class="campo-acceso">
              <label for="codigo">Código estudiantil</label>
              <div class="input-wrapper">
                <span class="icono-input">🔢</span>
                <input 
                  type="text" 
                  id="codigo" 
                  required 
                  placeholder="Ej: 2026001" 
                  autocomplete="off"
                  inputmode="numeric"
                  aria-label="Código estudiantil"
                />
              </div>
            </div>
            
            <button type="submit" class="boton boton-principal boton-grande-acceso">
              <span>INGRESAR</span>
              <span class="icono-flecha">→</span>
            </button>
          </form>
          
          <p id="mensajeLogin" class="mensaje-acceso" aria-live="polite"></p>
          
          <button type="button" class="boton boton-secundario boton-volver" id="btnVolverBienvenida">
            Volver
          </button>
        </main>
        
        <button type="button" class="boton-ver-creadores" id="btnVerCreadores">Ver creadores</button>
      </div>
    </div>

    <div id="modalCreadores" class="modal-creadores" hidden>
      <div class="modal-creadores-contenido" role="dialog" aria-modal="true" aria-label="Creadores Cusiana Decide">
        <button type="button" class="modal-creadores-cerrar" id="btnCerrarCreadores" aria-label="Cerrar">×</button>
        <img src="icons/creadores-cusiana-recorte.png" alt="Creadores de Cusiana Decide" class="foto-creadores" />
        <p class="creditos-titulo-modal">Creadores Cusiana Decide</p>
        <p class="creditos-nombres-modal">Dannia Beatriz Robles Pérez</p>
        <p class="creditos-nombres-modal">Andres Felipe Camacho Sigua</p>
        <p class="creditos-nombres-modal">Eileen Daniela Yaruro Amaya</p>
      </div>
    </div>

  <script src="js/db.js?v=8"></script>
  <script src="js/estado-conexion.js?v=8"></script>
  <script src="js/auth.js?v=14"></script>
  <script src="js/mejoras.js?v=1"></script>
  <script src="js/registrar-sw.js?v=8"></script>
</body>
</html>
